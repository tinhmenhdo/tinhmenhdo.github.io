<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Tinh Mệnh Đồ</title>
    <meta name="description" content="Bạn đang offline. Vui lòng kiểm tra kết nối internet." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        width: 100%;
      }

      .offline-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        opacity: 0.8;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: 700;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        line-height: 1.6;
        opacity: 0.9;
      }

      .retry-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        margin: 10px;
        text-decoration: none;
        display: inline-block;
      }

      .retry-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
      }

      .status {
        margin-top: 20px;
        font-size: 0.9rem;
        opacity: 0.7;
      }

      .online {
        color: #4ade80;
      }

      .offline {
        color: #f87171;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .pulse {
        animation: pulse 2s infinite;
      }
    </style>
  </head>

      </p>

      <button class="retry-btn" onclick="location.reload()">🔄 Thử lại</button>

    <script>
      // Monitor connection status
      function updateConnectionStatus() {
        const status = document.getElementById('connectionStatus');
        if (navigator.onLine) {
          status.textContent = 'Online';
          status.className = 'online';
          // Auto reload when back online
          setTimeout(() => {
            location.reload();
          }, 1000);
        } else {
          status.textContent = 'Offline';
          status.className = 'offline pulse';
        }
      }

      // Listen for online/offline events
      window.addEventListener('online', updateConnectionStatus);
      window.addEventListener('offline', updateConnectionStatus);

      // Initial status check
      updateConnectionStatus();

      // Auto-retry every 30 seconds
      setInterval(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 30000);
    </script>
