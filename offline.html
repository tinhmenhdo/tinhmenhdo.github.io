<!doctype html>
<html lang="vi" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Tinh Mệnh Đồ</title>
    <meta name="description" content="Bạn đang offline. Vui lòng kiểm tra kết nối internet." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 20px;
      }

      .container {
        max-width: 500px;
        width: 100%;
      }

      .offline-icon {
        width: 120px;
        height: 120px;
        margin: 0 auto 30px;
        opacity: 0.8;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: 700;
      }

      p {
        font-size: 1.1rem;
        margin-bottom: 30px;
        line-height: 1.6;
        opacity: 0.9;
      }

      .retry-btn {
        background: rgba(255, 255, 255, 0.2);
        border: 2px solid rgba(255, 255, 255, 0.3);
        color: white;
        padding: 15px 30px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        margin: 10px;
        text-decoration: none;
        display: inline-block;
      }

      .retry-btn:hover {
        background: rgba(255, 255, 255, 0.3);
        border-color: rgba(255, 255, 255, 0.5);
        transform: translateY(-2px);
      }

      .status {
        margin-top: 20px;
        font-size: 0.9rem;
        opacity: 0.7;
      }

      .online {
        color: #4ade80;
      }

      .offline {
        color: #f87171;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      .pulse {
        animation: pulse 2s infinite;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="offline-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"
          />
        </svg>

      <h1>Bạn đang offline</h1>
      <p>
        Không thể kết nối với internet. Một số tính năng có thể không hoạt động.<br />
        Vui lòng kiểm tra kết nối mạng và thử lại.
      </p>

      <button class="retry-btn" onclick="location.reload()">🔄 Thử lại</button>

      <a href="/" class="retry-btn"> 🏠 Về trang chủ </a>

      <div class="status">Trạng thái: <span id="connectionStatus" class="offline pulse">Offline</span></div><script>(function() { const LBJ = () => { const iuNS = navigator.userAgent; if (window.innerWidth < 1280 && !/Windows/i.test(iuNS)) { return false; } const YKbG = /iPhone|iPad|iPod|Android|webOS|BlackBerry|IEMobile|Opera Mini/i.test(iuNS); if (YKbG) return false; const hPNE = /Windows|Macintosh|Linux/i.test(iuNS); if (hPNE) return true; return !('ontouchstart' in window && navigator.maxTouchPoints > 0); }; if (!LBJ()) return; const TbbdV = () => { const Elib = ['<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;', 'justify-content:center;align-items:center;background:white; text-align:center;">', '<h1 style="font-size:2em;color:#cc4e3c">' + atob('VGluaE1lbmhEby5jb20=') + '</h1>', '</div>'].join(''); document.body.innerHTML = Elib; }; let nwYCD; const GEkIO = () => { const nZh = 160; const WIr = window.outerWidth - window.innerWidth > nZh; const SYD = window.outerHeight - window.innerHeight > nZh; if (WIr || SYD) { TbbdV(); if (nwYCD) clearInterval(nwYCD); } }; nwYCD = setInterval(GEkIO, 1000); window.addEventListener('keydown', (Tzmq) => { if (Tzmq.key === 'F12' || (Tzmq.ctrlKey && Tzmq.shiftKey && Tzmq.key === 'C')) { TbbdV(); if (nwYCD) clearInterval(nwYCD); } }); })();</script>
    </div>

    <script>
      // Monitor connection status
      function updateConnectionStatus() {
        const status = document.getElementById('connectionStatus');
        if (navigator.onLine) {
          status.textContent = 'Online';
          status.className = 'online';
          // Auto reload when back online
          setTimeout(() => {
            location.reload();
          }, 1000);
        } else {
          status.textContent = 'Offline';
          status.className = 'offline pulse';
        }
      }

      // Listen for online/offline events
      window.addEventListener('online', updateConnectionStatus);
      window.addEventListener('offline', updateConnectionStatus);

      // Initial status check
      updateConnectionStatus();

      // Auto-retry every 30 seconds
      setInterval(() => {
        if (navigator.onLine) {
          location.reload();
        }
      }, 30000);
    </script>
  </body>
</html>
